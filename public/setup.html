<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setup — サスとらの日本語</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div style="margin: 40px 0 32px;">
      <h1>サスとらの日本語</h1>
      <p class="subtitle">Connect your Notion workspace to get started</p>
    </div>

    <div class="form-group">
      <label for="apiKey">Notion API Key</label>
      <input type="password" id="apiKey" placeholder="secret_xxxx..." autocomplete="off">
    </div>

    <div class="form-group">
      <label for="dbId">Database ID</label>
      <input type="text" id="dbId" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off">
      <p class="subtitle">Found in the Notion database URL: notion.so/&lt;workspace&gt;/<strong>DATABASE_ID</strong>?v=…</p>
    </div>

    <div id="error" class="error"></div>
    <button class="btn btn-primary" id="connectBtn" style="margin-top: 8px;">Connect Notion</button>
  </div>
  <script src="setup.js"></script>
</body>
</html>
